<svg viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Chandru T" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#1a0606"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DC2626"/>
      <stop offset="1" stop-color="#F87171"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#DC2626" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .name{font:800 68px 'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:1px}
      .sub{font:500 20px 'Fira Code',Consolas,Menlo,monospace;fill:#F87171}
      .tag{font:500 14px 'Fira Code',Consolas,Menlo,monospace;fill:#9ca3af}
      .fade{animation:fade 1.2s ease-out both}
      .d2{animation-delay:.3s}.d3{animation-delay:.6s}
      @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
      .scan{animation:scan 4s linear infinite}
      @keyframes scan{from{transform:translateX(-300px)}to{transform:translateX(1500px)}}
      .blink{animation:blink 1s steps(2) infinite}
      @keyframes blink{50%{opacity:0}}
    </style>
  </defs>
  <rect width="1200" height="280" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="16" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="278" rx="15" fill="none" stroke="#DC2626" stroke-opacity="0.5" stroke-width="2"/>

  <circle cx="1040" cy="140" r="150" fill="#DC2626" fill-opacity="0.08"/>
  <circle cx="1040" cy="140" r="95" fill="none" stroke="#EF4444" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="6 10"/>
  <text x="1040" y="165" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="80" font-weight="700" fill="#EF4444" filter="url(#glow)">&lt;/&gt;</text>

  <text x="60" y="52" class="tag fade">// portfolio.init()</text>
  <text x="60" y="125" class="name fade d2" fill="url(#red)" filter="url(#glow)">Chandru T</text>
  <text x="60" y="170" class="sub fade d3">Developer &amp; Builder<tspan class="blink">_</tspan></text>
  <text x="60" y="210" class="tag fade d3">Full-Stack  •  Mobile  •  AI/ML  •  IoT</text>

  <rect class="scan" x="0" y="262" width="300" height="3" fill="url(#red)" opacity="0.9"/>
  <rect x="0" y="262" width="1200" height="3" fill="#DC2626" fill-opacity="0.15"/>
</svg>
